name: Lint and Code Quality

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-c:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install linting tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format cppcheck
    
    - name: Check C code with clang-format
      run: |
        # Check runtime.c formatting (dry-run, don't fail yet)
        clang-format --dry-run --Werror runtime.c || true
      continue-on-error: true
    
    - name: Run cppcheck on C code
      run: |
        cppcheck --enable=all --suppress=missingIncludeSystem \
          --error-exitcode=1 \
          runtime.c 2>&1 | head -50 || true
      continue-on-error: true
  
  lint-java:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Check Java code with basic checks
      run: |
        # Compile Java files to check for syntax errors
        javac -d /tmp/compiled JavaToLLVM.java 2>&1 | head -50
        javac -d /tmp/compiled Kernel.java 2>&1 | head -50 || true
      continue-on-error: true
    
    - name: Check for trailing whitespace
      run: |
        echo "Checking for trailing whitespace..."
        if grep -rI '[[:space:]]$' --include='*.java' --include='*.c' --include='*.h' --include='*.asm' .; then
          echo "Warning: Found trailing whitespace"
          exit 0  # Don't fail the build, just warn
        else
          echo "No trailing whitespace found"
        fi
      continue-on-error: true
